name: gta6-prep CI

# Builds and tests the gta6-prep branch. The upstream build.yml only runs on
# main/master pushes and pull requests, so this fork's branch would otherwise
# never be built. Only gta6-prep triggers on push, and one run at a time
# repo-wide: GitHub disabled Actions on this fork after ~10 concurrent builds
# from parallel work branches. Build other branches with workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      bisect_shas:
        description: >-
          Bisect mode: JSON array of full commit SHAs. Builds only `bisect_targets` at each,
          one at a time, and runs the ctest names matching `bisect_tests`. Empty: normal CI.
        default: ""
      bisect_targets:
        description: Space-separated build targets for bisect mode (missing ones are skipped)
        default: ""
      bisect_tests:
        description: ctest -R regex for bisect mode
        default: ""
  push:
    branches: [ gta6-prep ]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  KYTY_BUILD_ORIGIN: Fork
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

jobs:
  tools:
    name: Triage tools (Python)
    if: ${{ !inputs.bisect_shas }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run triage tool tests
        shell: bash
        run: |
          if [ -d tools/triage ]; then
            python -m unittest discover -s tools/triage/tests -t tools/triage -v
          else
            echo "tools/triage not present yet"
          fi

      - name: Run CI script and preflight tests
        shell: bash
        env:
          # The preflight tests run preflight.ps1 under pwsh; here they fail instead of skipping.
          KYTY_REQUIRE_PWSH: "1"
        run: |
          pwsh -NoProfile -Command '"pwsh " + $PSVersionTable.PSVersion'
          python -m unittest discover -s .github/scripts/tests -v
          python -m unittest discover -s tools/preflight/tests -v

  linux:
    name: Build and test (Linux)
    if: ${{ !inputs.bisect_shas }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          # A newer Mesa gives lavapipe more of the features the GPU test harness requires.
          sudo add-apt-repository -y ppa:kisak/kisak-mesa || echo "::warning::kisak-mesa PPA unavailable"
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang glslang-tools libasound2-dev libdbus-1-dev libgl1-mesa-dev \
            libpulse-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev \
            libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev \
            libxss-dev libxtst-dev lld pkg-config wayland-protocols \
            mesa-vulkan-drivers vulkan-tools

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B _Build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DKYTY_BUILD_ORIGIN="$KYTY_BUILD_ORIGIN" \
            -DKYTY_BUILD_REPOSITORY="$KYTY_BUILD_REPOSITORY" \
            -DKYTY_RELEASE_TAG="gta6-prep-${GITHUB_SHA::7}" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR"

      # The test list is every target an add_test() runs, so new tests are
      # built and run without editing this file.
      - name: Collect test targets
        id: targets
        shell: bash
        run: |
          known=$(ninja -C _Build/linux -t targets all | cut -d: -f1 | sort -u)
          targets=$(grep -o 'TARGET_FILE:[a-z0-9_]*' CMakeLists.txt | cut -d: -f2 | sort -u | grep -Fxf <(echo "$known") | tr '\n' ' ')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets"

      - name: Build
        shell: bash
        run: |
          cmake --build _Build/linux --target launcher ${{ steps.targets.outputs.targets }} --parallel -- -k 0

      - name: Vulkan devices on the runner
        shell: bash
        run: |
          vulkaninfo --summary || true
          vulkaninfo 2>/dev/null | grep -E 'fragmentShaderBarycentric|shaderImageInt64Atomics|workgroupMemoryExplicitLayout |shaderSharedInt64Atomics|shaderBufferInt64Atomics|subgroupSize' | sort -u || true

      - name: Test (host)
        shell: bash
        run: python3 .github/scripts/run_tests.py _Build/linux host

      - name: Test (GPU harness, lavapipe; informational)
        if: always()
        shell: bash
        run: python3 .github/scripts/run_tests.py _Build/linux gpu

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-linux
          path: _Build/*/ctest-*.log
          if-no-files-found: ignore

      - name: Install
        shell: bash
        run: cmake --install _Build/linux --prefix _Build/linux/install

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-gta6-prep-Linux-x86_64
          path: _Build/linux/install/**
          if-no-files-found: error

  windows:
    name: Build and test (Windows)
    if: ${{ !inputs.bisect_shas }}
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_ORIGIN=%KYTY_BUILD_ORIGIN% ^
            -DKYTY_BUILD_REPOSITORY=%KYTY_BUILD_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=gta6-prep ^
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Collect test targets
        id: targets
        shell: bash
        run: |
          known=$(ninja -C _Build/windows -t targets all | cut -d: -f1 | sort -u)
          targets=$(grep -o 'TARGET_FILE:[a-z0-9_]*' CMakeLists.txt | cut -d: -f2 | sort -u | grep -Fxf <(echo "$known") | grep -vx vdecsw_tests | tr '\n' ' ')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: cmd
        run: cmake --build _Build/windows --target launcher ${{ steps.targets.outputs.targets }} --parallel -- -k 0

      - name: Test (host)
        shell: bash
        run: python .github/scripts/run_tests.py _Build/windows host

      - name: Test (GPU harness; informational, runner has no GPU)
        if: always()
        shell: bash
        run: python .github/scripts/run_tests.py _Build/windows gpu

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-windows
          path: _Build/*/ctest-*.log
          if-no-files-found: ignore

      - name: Install
        id: install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install

      # The GPU tests cannot run here (no GPU). They go into the artifact with tools/preflight, so
      # that one download runs them on a PC that has one (tools/preflight/README.md). Assembled
      # outside the install tree and moved in last: when this step fails, the job is red, but the
      # emulator is still uploaded, without a half-written preflight folder.
      - name: Package the GPU tests and preflight
        id: preflight_package
        shell: bash
        run: |
          python .github/scripts/package_gpu_tests.py _Build/windows _Build/windows/preflight-staging/gpu-tests
          cp tools/preflight/preflight.ps1 tools/preflight/preflight.cmd tools/preflight/README.md \
            tools/triage/collect_logs.ps1 _Build/windows/preflight-staging/
          mv _Build/windows/preflight-staging _Build/windows/install/preflight

      - name: Upload Windows build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-gta6-prep-Windows-x64
          path: _Build/windows/install/**
          if-no-files-found: error

      # The packaged preflight under Windows PowerShell 5.1, as on a PC without pwsh. Each check
      # fails on exit code 2 (preflight could not run), a missing summary.json or a missing zip.
      - name: Smoke-test preflight, packaged GPU tests (Windows PowerShell 5.1)
        if: ${{ !cancelled() && steps.preflight_package.outcome == 'success' }}
        timeout-minutes: 12
        shell: powershell
        env:
          KYTY_PREFLIGHT_NO_PAUSE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $preflight = Join-Path $env:GITHUB_WORKSPACE '_Build\windows\install\preflight'
          $out = Join-Path $env:RUNNER_TEMP 'preflight-smoke\tests'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Only Windows' own folders on PATH, as on the PC: a DLL missing from gpu-tests must not
          # come from the runner's MinGW, Strawberry or Git folders.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          # Through preflight.cmd, as on the PC, with a test of each packaged executable.
          & cmd.exe /d /c "$preflight\preflight.cmd" -Only 'device_creation,kernel_file_system' -OutDir $out
          $rc = $LASTEXITCODE
          Write-Host "preflight.cmd exit code: $rc"
          if ($rc -ne 0 -and $rc -ne 1) { throw "preflight exited with $rc" }
          $run = @(Get-ChildItem -LiteralPath $out -Directory -Filter 'kyty-preflight-*')
          if ($run.Count -ne 1) { throw "expected one result folder in $out, found $($run.Count)" }
          $run = $run[0].FullName
          Get-Content -LiteralPath (Join-Path $run 'summary.txt')
          if (-not (Test-Path -LiteralPath "$run.zip")) { throw "no zip next to $run" }
          $summary = [System.IO.File]::ReadAllText((Join-Path $run 'summary.json')) | ConvertFrom-Json
          # Without a GPU the tests fail, but they must have run: not ERROR (not started), and not
          # the exit code of a program Windows could not load (0xC0000135: a DLL was not found).
          $unloadable = @('0xC0000135', '0xC0000139', '0xC000007B', '0xC0000142')
          foreach ($name in @('device_creation', 'kernel_file_system')) {
            $step = @($summary.steps | Where-Object { $_.name -eq $name })
            if ($step.Count -ne 1) { throw "summary.json has no step $name" }
            $step = $step[0]
            if (@('PASS', 'FAIL', 'TIMEOUT') -notcontains $step.status -or $unloadable -contains $step.exit_code_hex) {
              throw "${name}: $($step.status) $($step.exit_code_hex) $($step.detail): the packaged test did not run"
            }
          }
          # The harness's own failure message: the packaged exe ran main() with --device-creation-only.
          $device = @($summary.steps | Where-Object { $_.name -eq 'device_creation' })[0]
          $log = [System.IO.File]::ReadAllText((Join-Path $run 'tests\device_creation.log'))
          if ($device.status -eq 'FAIL' -and $log -notmatch 'ShaderRecompilerComputeTests: DeviceCreation failed') {
            throw "device_creation failed without the harness's DeviceCreation message: see tests\device_creation.log"
          }
          exit 0

      - name: Smoke-test preflight, empty game folder (Windows PowerShell 5.1)
        if: ${{ !cancelled() && steps.preflight_package.outcome == 'success' }}
        timeout-minutes: 15
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $preflight = Join-Path $env:GITHUB_WORKSPACE '_Build\windows\install\preflight'
          $game = Join-Path $env:RUNNER_TEMP 'preflight-smoke\empty-game'
          $out = Join-Path $env:RUNNER_TEMP 'preflight-smoke\game'
          New-Item -ItemType Directory -Force -Path $game, $out | Out-Null
          # The emulator cannot load an empty folder: preflight must record that and still zip.
          # The -ExtraArgs value starts with '-' and holds a drive letter's colon, which -File splits.
          $extra = "--nid-names $env:RUNNER_TEMP\preflight-smoke\names.txt"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$preflight\preflight.ps1" -Game $game -BootSeconds 20 -OutDir $out -ExtraArgs $extra
          $rc = $LASTEXITCODE
          Write-Host "preflight.ps1 exit code: $rc"
          if ($rc -ne 0 -and $rc -ne 1) { throw "preflight exited with $rc" }
          $run = @(Get-ChildItem -LiteralPath $out -Directory -Filter 'kyty-preflight-*')
          if ($run.Count -ne 1) { throw "expected one result folder in $out, found $($run.Count)" }
          $run = $run[0].FullName
          Get-Content -LiteralPath (Join-Path $run 'summary.txt')
          if (-not (Test-Path -LiteralPath "$run.zip")) { throw "no zip next to $run" }
          $summary = [System.IO.File]::ReadAllText((Join-Path $run 'summary.json')) | ConvertFrom-Json
          $names = @($summary.steps | ForEach-Object { $_.name })
          if (($names -join ',') -ne 'imports,boot,logs') { throw "summary.json steps: $($names -join ', ')" }
          if ((@($summary.options.extra_args) -join ' ') -ne $extra) { throw "-ExtraArgs arrived as: $(@($summary.options.extra_args) -join ' | ')" }
          $imports = @($summary.steps)[0]
          if ($imports.status -ne 'FAIL') { Write-Host "::warning::the import report of an empty folder is $($imports.status), not FAIL" }
          exit 0

      # A test that outlives its time limit, with a child process: preflight must stop both
      # (taskkill /T /F) and still zip. cmd.exe and ping.exe stand in for a hung GPU test.
      - name: Smoke-test preflight, a hung test (Windows PowerShell 5.1)
        if: ${{ !cancelled() && steps.preflight_package.outcome == 'success' }}
        timeout-minutes: 12
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'preflight-smoke\hung'
          $package = Join-Path $root 'preflight\gpu-tests'
          New-Item -ItemType Directory -Force -Path (Join-Path $package 'bin') | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '_Build\windows\install\preflight\preflight.ps1') (Join-Path $root 'preflight')
          Copy-Item (Join-Path $env:SystemRoot 'System32\cmd.exe') (Join-Path $package 'bin\cmd.exe')
          $tests = '{"format": 1, "tests": [{"name": "hang", "executable": "bin/cmd.exe", "args": ["/d", "/c", "ping -n 600 127.0.0.1"], "timeout": 5, "quick": true}]}'
          [System.IO.File]::WriteAllText((Join-Path $package 'tests.json'), $tests)
          $started = Get-Date
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'preflight\preflight.ps1') -OutDir (Join-Path $root 'out')
          $rc = $LASTEXITCODE
          Write-Host "preflight.ps1 exit code: $rc"
          if ($rc -ne 1) { throw "preflight exited with $rc, not 1" }
          $run = @(Get-ChildItem -LiteralPath (Join-Path $root 'out') -Directory -Filter 'kyty-preflight-*')[0].FullName
          Get-Content -LiteralPath (Join-Path $run 'summary.txt')
          if (-not (Test-Path -LiteralPath "$run.zip")) { throw "no zip next to $run" }
          $summary = [System.IO.File]::ReadAllText((Join-Path $run 'summary.json')) | ConvertFrom-Json
          $step = @($summary.steps)[0]
          if ($step.status -ne 'TIMEOUT' -or $step.seconds -gt 30) { throw "hang: $($step.status) after $($step.seconds) s" }
          Start-Sleep -Seconds 2
          $left = @(Get-Process -Name ping, cmd -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$root*" -or ($_.Name -eq 'PING' -and $_.StartTime -ge $started) })
          if ($left.Count -gt 0) { throw "still running: $(($left | ForEach-Object { "$($_.Name) $($_.Id)" }) -join ', ')" }
          exit 0

      - name: Upload preflight smoke-test results
        if: ${{ !cancelled() && steps.preflight_package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: preflight-smoke-windows
          path: ${{ runner.temp }}/preflight-smoke/**/kyty-preflight-*.zip
          if-no-files-found: warn

  # Bisect mode (workflow_dispatch with bisect_shas): one job per commit, strictly one at a time,
  # each building only the requested targets with the Linux job's toolchain and flags.
  bisect:
    name: Bisect ${{ matrix.sha }}
    if: ${{ inputs.bisect_shas }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sha: ${{ fromJSON(inputs.bisect_shas || '[]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang glslang-tools libasound2-dev libdbus-1-dev libgl1-mesa-dev \
            libpulse-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev \
            libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev \
            libxss-dev libxtst-dev lld pkg-config wayland-protocols

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B _Build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DKYTY_BUILD_ORIGIN="$KYTY_BUILD_ORIGIN" \
            -DKYTY_BUILD_REPOSITORY="$KYTY_BUILD_REPOSITORY" \
            -DKYTY_RELEASE_TAG="bisect-${GITHUB_SHA::7}" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR"

      - name: Build
        shell: bash
        env:
          TARGETS: ${{ inputs.bisect_targets }}
        run: |
          known=$(ninja -C _Build/linux -t targets all | cut -d: -f1 | sort -u)
          present=$(printf '%s\n' $TARGETS | grep -Fxf <(echo "$known") | tr '\n' ' ')
          echo "building: $present"
          cmake --build _Build/linux --target $present --parallel -- -k 0

      - name: Test
        shell: bash
        env:
          TESTS: ${{ inputs.bisect_tests }}
        run: |
          ctest --test-dir _Build/linux --output-on-failure -R "$TESTS" 2>&1 | tee ctest.log || true
          echo "::notice title=bisect ${{ matrix.sha }}::$(grep -E 'tests passed|\(Failed\)|\(Subprocess|\(Not Run\)|Exception' ctest.log | tr '\n' ';')"
